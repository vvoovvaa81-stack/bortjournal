name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Bortjournal-1.0.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Бортжурнал 1.0.${{ github.run_number }}
          body: |
            Скачайте файл Bortjournal-1.0.${{ github.run_number }}.apk ниже и откройте его на телефоне.
            Обновление ставится поверх старой версии, данные сохраняются.
          files: Bortjournal-1.0.${{ github.run_number }}.apk
          make_latest: true
